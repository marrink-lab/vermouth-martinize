$schema: "./schema-pipeline.yaml"
martinize2:
  variables:
    - ff
  cli_flags:
    from_ff:
      cli: from 
      default: "charmm"
      help: "Force field of the original structure."

    extra_ff_dir:
      action: append
      default: []
      type: path
      help: "Additional repository for custom force fields."

    extra_map_dir:
      action: append
      default: []
      type: path
      help: "Additional repository for mapping files."

    list_ff:
      action: store_true
      help: "List all known force fields, and exit."

    list_blocks:
      action: store_true
      help: "List all Blocks and Modifications known to the force field, and exit."
    go:
        nargs: '?'
        const: true
        type: path
        help: >
          Use Martini Go model. Accepts either an input file from the server,
          or just provide the flag to calculate as part of Martinize.
    maxwarn:
        type: maxwarn
        action: append
        nargs: "+"
        default: []
        help: >
          The maximum number of allowed warnings. If more warnings are encountered
          no output files are written.
        
  steps: !!omap
    - vermouth.pipeline_processors.ListBlocks:
        condition:
          equal:
            cli: list_blocks
            value: true
        args:
          from_ff:
            variable: ff
          to_ff:
            variable: ff
    - vermouth.pipeline_processors.ReadSystem:
        cli_flags:
          inpath:
            cli: f
            help: "Input file (PDB|GRO)"
            required: true
            type: path
          ignore_res:
            cli: ignore
            nargs: "+"
            default: []
            action: append
            type: ignore_resname
            help: "Ignore residues with that name: e.g. -ignore HOH,LIG (+)"
          ignore_h:
            help: "Ignore all Hydrogen atoms in the input file"
            action: store_true
            default: false
          modelidx:
            help: "Which MODEL to select. Only meaningful for PDB files."
            type: int
            default: null
        args:
          path:
            cli: inpath
          ignore_resnames:
            cli: ignore_res
          ignh:
            cli: ignore_h
          modelidx:
            cli: modelidx

    - pdb_to_universal:
        steps: !!omap
          - vermouth.pipeline_processors.MakeBondsWrapper:
              cli_flags:
                bonds_from:
                  type: str
                  choices: ["name", "distance", "none", "both"]
                  default: "both"
                  help: >
                    How to determine connectivity in the input.
                    If 'none', only bonds from the input file (CONECT) will be used.
                fudge:
                  type: float
                  default: 1.2
                  help: >
                    Factor with which Van der Waals radii should be scaled when determining
                    bonds based on distances.
              args:
                bonds_from:
                  cli: bonds_from
                fudge:
                  cli: fudge

          - vermouth.MergeNucleicStrands:
              args: {}
          - vermouth.pdb.WritePDB:
              cli_flags:
                write_graph:
                  type: path
                  required: false
                  help: "Write the graph as PDB after the MakeBonds step."
              args:
                path:
                  cli: write_graph
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: false

          - vermouth.pipeline_processors.AnnotateMutModWrapper:
              cli_flags:
                modify:
                  action: append
                  default: []
                  help: >
                    Add a modification to a residue. Desired modification is
                    specified as, e.g. A-ASP45:ASP0. The format is
                    <chain>-<resname><resid>:[+]<modification>. Elements of the
                    specification can be omitted as required. e.g. ASP45:ASP0
                    will modify all ASP with resid 45 to ASP0, A-ASP:ASP0 will
                    modify all ASP on chain A to ASP0. By default the
                    modifications specified this way will override any
                    modifications found in the input file. If instead you want
                    to *add* modifications in addition to what's already in the
                    input file, add '+' to the modification specification. For
                    example, 'A-HIS1:+HSE' to add the HSE modification to any
                    automatically determined terminal modifications.
                cter:
                  action: append
                  default: []
                  help: >
                    Shorthand for patching C-termini. A C-terminus is defined
                    as a residue which is connected to 1 other residue, and has
                    the lowest resid.
                nter:
                  action: append
                  default: []
                  help: >
                    Shorthand for patching N-termini. An N-terminus is defined
                    as a residue which is connected to 1 other residue, and has
                    the highest resid.
                mutate:
                  action: append
                  default: []
                  help: >
                    Mutate a residue. Desired mutation is specified as, e.g.
                    A-PHE45:ALA. The format is
                    <chain>-<resname><resid>:<new resname>. Elements of the
                    specification can be omitted as required. e.g. PHE45:ALA
                    will mutate all PHE with resid 45 to ALA, A-PHE:ALA will
                    mutate all PHE on chain A to ALA.
                neutral_termini:
                  cli: nt
                  action: store_true
                  default: false
                  help: >
                    Set neutral termini (charged is default). Alias for
                    "-nter NH2-ter -cter COOH-ter"
              args:
                modify:
                  cli: modify
                cter:
                  cli: cter
                nter:
                  cli: nter
                mutate:
                  cli: mutate
                neutral_termini:
                  cli: neutral_termini

          - vermouth.RepairGraph:
              args:
                delete_unknown:
                  value: true
                include_graph:
                  value: false

          - vermouth.pdb.WritePDB:
              cli_flags:
                write_repair:
                  type: path
                  required: false
                  help: >
                    Write the graph as PDB after the
                    RepairGraph step. The resulting file may
                    contain "nan" coordinates making it
                    unreadable by most softwares.
              args:
                path:
                  cli: write_repair
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: true

          - vermouth.CanonicalizeModifications:
              args: {}

          - vermouth.pdb.WritePDB:
              cli_flags:
                write_canon:
                  type: path
                  required: false
                  help: >
                    Write the graph as PDB after the
                    CanonicalizeModifications step. The
                    resulting file may contain "nan"
                    coordinates making it unreadable by most
                    software.
              args:
                path:
                  cli: write_canon
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: true

          - vermouth.AttachMass:
              args:
                attribute:
                  value: mass

          - vermouth.SortMoleculeAtoms:
              args: {}

    - vermouth.StashAttributes:
        args:
          attributes:
            value: ["resid"]
          stash_name:
            value: "stash"

    - vermouth.gmx.topology.Header:
        args: {}

    - choose_secstruct:
        cli_groups:
          - type: mutually_exclusive
            flags:
              dssp:
                nargs: "?"
                const: True
                help: >
                  DSSP executable for determining structure. If this flag is given
                  but no executable is specified, the mdtraj library will be used
                  to compute the secondary structure, if it can be imported.
              ss:
                type: str
                default: null
                help: >
                  Manually set the secondary structure of the proteins.
                  Either give a dssp sequence for each residue in your input file
                  or a single letter to be repeated for the entire sequence, e.g. -ss C
              collagen:
                action: store_true
                default: false
                help: "Use collagen parameters"
        steps: !!omap
          - vermouth.pipeline_processors.DSSPWrapper:
              condition:
                not:
                  equal:
                    cli: dssp
                    value: null
              args:
                executable:
                  cli: dssp
                savedir:
                  value: "."

          - vermouth.dssp.dssp.AnnotateMartiniSecondaryStructures:
              condition:
                not:
                  equal:
                    cli: dssp
                    value: null
              args: {}

          - vermouth.pipeline_processors.SSWrapper:
              condition:
                all:
                  - not:
                      equal:
                        cli: ss
                        value: null
                  - equal:
                      cli: dssp
                      value: null
              args:
                attr:
                  value: aasecstruct
                seq:
                  cli: ss

          - vermouth.dssp.dssp.AnnotateMartiniSecondaryStructures:
              condition:
                not:
                  equal:
                    cli: ss
                    value: null
              args: {}

          - vermouth.pipeline_processors.SSWrapper:
              condition:
                all:
                  - equal:
                      cli: ss
                      value: null
                  - equal:
                      cli: dssp
                      value: null
                  - equal:
                      cli: collagen
                      value: true
              args:
                attr:
                  value: cgsecstruct
                seq:
                  value: "F"
                
    - vermouth.SetMoleculeMeta:
        cli_flags:
          extdih:
            action: store_true
            default: false
            help: >
              Use dihedrals for extended regions rather than elastic bonds
        args:
          extdih:
            cli: extdih

    - vermouth.pipeline_processors.SetMoleculeMetaScFixWrapper:
        cli_flags:
          noscfix:
            action: store_true
            default: false
            help: >
              Don't apply side chain corrections. Please note the change
              in behaviour from martinize v0.11.0
        args:
          noscfix:
            cli: noscfix
            
    - cystein_bridges:
        cli_flags:
          cystein_bridge:
            cli: cys 
            type: cys_argument
            default: auto
            help: "Cystein bonds"
        steps: !!omap
          - vermouth.RemoveCysteinBridgeEdges:
              condition:
                equal:
                  cli: cystein_bridge
                  value: "none"
              args: {}

          - vermouth.AddCysteinBridgesThreshold:
              condition:
                all:
                  - not:
                      equal:
                        cli: cystein_bridge
                        value: "auto"
                  - not:
                      equal:
                        cli: cystein_bridge
                        value: "none"
              args:
                threshold:
                  cli: cystein_bridge

    - go_system:
        steps: !!omap
          - vermouth.MergeAllMolecules:
              condition:
                not:
                  equal:
                    cli: go
                    value: null
              args: {}

          - vermouth.pipeline_processors.GoReader:
              condition:
                all:
                  - not:
                      equal:
                        cli: go
                        value: null
                  - not:
                      equal:
                        cli: go
                        value: true
              args:
                file_path:
                  cli: go

          - vermouth.rcsu.contact_map.GenerateContactMap:
              condition:
                equal:
                  cli: go
                  value: true
              args:
                write_file:
                  cli: go_write_file