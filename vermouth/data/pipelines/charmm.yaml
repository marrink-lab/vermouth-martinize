$schema: "./schema-pipeline.yaml"
martinize2:
  variables:
    - ff
  cli_sections:
    - "Input and output files"
    - "Force field selection"
    - "Position restraints"
    - "Secondary structure handling"
    - "Protein elastic network"
    - "Virtual site based GoMartini"
    - "Apply water bias."
    - "Protein description"
    - "Debugging options"
  cli_flags:
    from_ff:
      cli: from
      default: "charmm"
      section: "Force field selection"
      help: "Force field of the original structure."

    extra_ff_dir:
      action: append
      default: []
      type: path
      section: "Force field selection"
      help: "Additional repository for custom force fields."

    extra_map_dir:
      action: append
      default: []
      type: path
      section: "Force field selection"
      help: "Additional repository for mapping files."

    list_ff:
      action: store_true
      section: "Force field selection"
      help: "List all known force fields, and exit."

    list_blocks:
      action: store_true
      section: "Force field selection"
      help: "List all known blocks and modifications for the selected force fields."
    go:
        nargs: '?'
        const: true
        type: path
        section: "Virtual site based GoMartini"
        help: Use Martini Go model.
    maxwarn:
        type: maxwarn
        action: append
        nargs: "+"
        default: []
        section: "Debugging options"
        help: >
          The maximum number of allowed warnings. If more warnings are encountered
          no output files are written.

  steps: !!omap
    - vermouth.pipeline_processors.ListBlocks:
        condition:
          equal:
            cli: list_blocks
            value: true
        args:
          from_ff:
            variable: ff
          to_ff:
            variable: ff
    - vermouth.pipeline_processors.ReadSystem:
        cli_section: "Input and output files"
        cli_flags:
          inpath:
            cli: f
            help: path to input file
            required: true
            type: path
          ignore_res:
            cli: ignore
            nargs: "+"
            default: []
            action: append
            type: ignore_resname
            help: "Ignore residues with that name: e.g. -ignore HOH,LIG (+)"
          ignore_h:
            help: ignore hydrogens
            action: store_true
            default: false
          modelidx:
            help: model number
            type: int
            default: null
        args:
          path:
            cli: inpath
          ignore_resnames:
            cli: ignore_res
          ignh:
            cli: ignore_h
          modelidx:
            cli: modelidx

    - pdb_to_universal:
        steps: !!omap
          - vermouth.pipeline_processors.MakeBondsWrapper:
              cli_section: "Input and output files"
              cli_flags:
                bonds_from:
                  type: str
                  choices: ["name", "distance", "none", "both"]
                  default: "both"
                  help: >
                    How to determine connectivity in the input.
                    If 'none', only bonds from the input file (CONECT) will be used.
                fudge:
                  type: float
                  default: 1.2
                  help: >
                    Factor with which Van der Waals radii should be scaled when determining
                    bonds based on distances.
              args:
                bonds_from:
                  cli: bonds_from
                fudge:
                  cli: fudge

          - vermouth.MergeNucleicStrands:
              args: {}
          - vermouth.pdb.WritePDB:
              cli_section: "Debugging options"
              cli_flags:
                write_graph:
                  type: path
                  required: false
                  help: "Write the graph as PDB after the MakeBonds step."
              args:
                path:
                  cli: write_graph
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: false

          - vermouth.pipeline_processors.AnnotateMutModWrapper:
              cli_section: "Protein description"
              cli_flags:
                modify:
                  action: append
                  default: []
                  help: modifications to apply to a specific residue.
                cter:
                  action: append
                  default: []
                  help: C-terminus modification for a specific c-terminus
                nter:
                  action: append
                  default: []
                  help: N-terminus modification for a specific n-terminus
                mutate:
                  action: append
                  default: []
                  help: mutate a specific amino acid into another one.
                neutral_termini:
                  cli: nt
                  action: store_true
                  default: false
                  help: Use neutral N- and C-termini.
              args:
                modify:
                  cli: modify
                cter:
                  cli: cter
                nter:
                  cli: nter
                mutate:
                  cli: mutate
                neutral_termini:
                  cli: neutral_termini

          - vermouth.RepairGraph:
              args:
                delete_unknown:
                  value: true
                include_graph:
                  value: false

          - vermouth.pdb.WritePDB:
              cli_section: "Debugging options"
              cli_flags:
                write_repair:
                  type: path
                  required: false
                  help: >
                    Write the graph as PDB after the
                    RepairGraph step. The resulting file may
                    contain "nan" coordinates making it
                    unreadable by most softwares.
              args:
                path:
                  cli: write_repair
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: true

          - vermouth.CanonicalizeModifications:
              args: {}

          - vermouth.pdb.WritePDB:
              cli_section: "Debugging options"
              cli_flags:
                write_canon:
                  type: path
                  required: false
                  help: >
                    Write the graph as PDB after the
                    CanonicalizeModifications step. The
                    resulting file may contain "nan"
                    coordinates making it unreadable by most
                    software."
              args:
                path:
                  cli: write_canon
                omit_charges:
                  value: true
                defer_writing:
                  value: false
                nan_missing_pos:
                  value: true

          - vermouth.AttachMass:
              args:
                attribute:
                  value: mass

          - vermouth.SortMoleculeAtoms:
              args: {}

    - vermouth.StashAttributes:
        args:
          attributes:
            value: ["resid"]
          stash_name:
            value: "stash"

    - vermouth.gmx.topology.Header:
        args: {}

    - choose_secstruct:
        cli_section: "Secondary structure handling"
        cli_groups:
          - type: mutually_exclusive
            flags:
              dssp:
                nargs: "?"
                const: True
                help: >
                  DSSP executable for determining structure. If this flag is given
                  but no executable is specified, the mdtraj library will be used
                  to compute the secondary structure, if it can be imported.
              ss:
                type: str
                default: null
                help: >
                  (Manually set the secondary structure of the proteins.
                  Either give a dssp sequence for each residue in your input file
                  or a single letter to be repeated for the entire sequence, e.g. -ss C)
              collagen:
                action: store_true
                default: false
                help: "Use collagen parameters"
        steps: !!omap
          - vermouth.pipeline_processors.DSSPWrapper:
              condition:
                not:
                  equal:
                    cli: dssp
                    value: null
              args:
                executable:
                  cli: dssp
                savedir:
                  value: "."

          - vermouth.dssp.dssp.AnnotateMartiniSecondaryStructures:
              condition:
                not:
                  equal:
                    cli: dssp
                    value: null
              args: {}

          - vermouth.pipeline_processors.SSWrapper:
              condition:
                all:
                  - not:
                      equal:
                        cli: ss
                        value: null
                  - equal:
                      cli: dssp
                      value: null
              args:
                attr:
                  value: aasecstruct
                seq:
                  cli: ss

          - vermouth.dssp.dssp.AnnotateMartiniSecondaryStructures:
              condition:
                not:
                  equal:
                    cli: ss
                    value: null
              args: {}

          - vermouth.pipeline_processors.SSWrapper:
              condition:
                all:
                  - equal:
                      cli: ss
                      value: null
                  - equal:
                      cli: dssp
                      value: null
                  - equal:
                      cli: collagen
                      value: true
              args:
                attr:
                  value: cgsecstruct
                seq:
                  value: "F"
                
    - vermouth.SetMoleculeMeta:
        cli_section: "Secondary structure handling"
        cli_flags:
          extdih:
            action: store_true
            default: false
            help: >
              Use dihedrals for extended regions, rather than elastic bonds
        args:
          extdih:
            cli: extdih

    - vermouth.pipeline_processors.SetMoleculeMetaScFixWrapper:
        cli_section: "Protein description"
        cli_flags:
          noscfix:
            action: store_true
            default: false
            help: >
              Don't apply side chain corrections. Please note the change
              in behaviour from martinize v0.11.0
        args:
          noscfix:
            cli: noscfix
    - cystein_bridges:
        cli_section: "Protein description"
        cli_flags:
          cystein_bridge:
            cli: cys 
            type: cys_argument
            default: auto
        steps: !!omap
          - vermouth.RemoveCysteinBridgeEdges:
              condition:
                equal:
                  cli: cystein_bridge
                  value: "none"
              args: {}

          - vermouth.AddCysteinBridgesThreshold:
              condition:
                all:
                  - not:
                      equal:
                        cli: cystein_bridge
                        value: "auto"
                  - not:
                      equal:
                        cli: cystein_bridge
                        value: "none"
              args:
                threshold:
                  cli: cystein_bridge

    - go_system:
        steps: !!omap
          - vermouth.MergeAllMolecules:
              condition:
                not:
                  equal:
                    cli: go
                    value: null
              args: {}

          - vermouth.pipeline_processors.GoReader:
              condition:
                all:
                  - not:
                      equal:
                        cli: go
                        value: null
                  - not:
                      equal:
                        cli: go
                        value: true
              args:
                file_path:
                  cli: go

          - vermouth.rcsu.contact_map.GenerateContactMap:
              condition:
                equal:
                  cli: go
                  value: true
              args:
                write_file:
                  cli: go_write_file