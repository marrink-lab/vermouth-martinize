$schema: ./schema-pipeline.yaml
martinize2:
  variables:
    - ff
    - mappings
  cli_flags:
    to_ff:
      cli: ff
      default: martini3007
      help: Which forcefield to use
    go_write_file: 
      cli: go-write-file
      nargs: '?'
      const: contact_map_martinize.out
      default: false
      type: path
      help: Write out contact map to file.
    molname:
      cli: name
      type: str
      default: molecule
      help: Name for the output molecule.
    water_bias:
      cli: water-bias
      action: store_true
      default: false
      help: Automatically apply water bias.
    water_bias_eps:
      cli: water-bias-eps
      nargs: +
      type: water_bias
      default: []
    water_bias_idrs:
      cli: id-regions
      nargs: +
      default: []
    elastic:
      action: store_true
      default: false
      help: Write elastic bonds
    rb_unit:
      cli: eunit
      type: str
      default: molecule
  steps: !!omap
    - martinize:
        steps: !!omap
          - vermouth.DoMapping:
              args:
                to_ff:
                  variable: ff
                mappings:
                  variable: mappings
                delete_unknown:
                  value: true
                attribute_keep:
                  value:
                    - cgsecstruct
                    - chain
                    - aasecstruct
                    - resname
                    - stash
                attribute_must:
                  value:
                    - resname
                    - atype
          - vermouth.DoAverageBead:
              args:
                ignore_missing_graphs:
                  value: true
          - vermouth.AnnotateIDRs:
              args:
                id_regions:
                  cli: water_bias_idrs
          - vermouth.pipeline_processors.SetMoleculeMetaIDRWrapper:
              args:
                id_regions:
                  cli: water_bias_idrs
                  
          - vermouth.DoLinks:
              args: {}
          - vermouth.LocateChargeDummies:
              args: {}
    - vermouth.RTPPolisher:
        condition:
          has_variable:
            variable: ff
            key: bondedtypes
        args: {}
    - vermouth.pipeline_processors.ApplyPosresWrapper:
        condition:
          not:
            equal:
              cli: posres
              value: none
        cli_flags:
          posres:
            cli: p 
            type: str
            default: none
            choices:
              - none
              - all
              - backbone
            help: Output position restraints (none/all/backbone)
          posres_fc:
            type: float
            default: 1000
            help: Position restraints force constant in kJ/mol/nm^2
        args:
          posres:
            cli: posres
          posres_fc:
            cli: posres_fc
          force_field:
            variable: ff
    - vermouth.pipeline_processors.GoModelWrapper:
        condition:
          not:
            equal:
              cli: go
              value: null
        cli_flags:
          go_low:
            type: float
            default: 0.3
            help: Minimum distance (nm) below which contacts are removed.
          go_up:
            type: float
            default: 1.1
            help: Maximum distance (nm) above which contacts are removed.
          go_res_dist:
            type: int
            default: 3
            help: >-
              Minimum graph distance (similar sequence distance) below which
              contacts are removed.
          go_backbone:
            type: str
            default: CA
            help: >-
              Name of protein backbone bead on which to place a virtual
              interaction go site
          go_atomname:
            type: str
            default: VS
            help: Name of the virtual interaction go site atom
          go_eps:
            type: float
            default: 6.0
            help: The strength of the Go model structural bias in kJ/mol.
          go:
            nargs: '?'
            const: true
            type: path
            default: null
            help: Use Martini Go model.
        args:
          go_low:
            cli: go_low
          go_up:
            cli: go_up
          go_res_dist:
            cli: go_res_dist
          go_backbone:
            cli: go_backbone
          go_atomname:
            cli: go_atomname
          molname:
            cli: molname
          go_eps:
            cli: go_eps
          water_bias:
            cli: water_bias
          water_bias_eps:
            cli: water_bias_eps
          water_bias_idrs:
            cli: water_bias_idrs
    - vermouth.pipeline_processors.MergeChainsWrapper:
        condition:
          not:
            equal:
              cli: merge_chains
              value: []
        cli_flags:
          merge_chains:
            type: str
            action: append
            default: []
            help: >
              Merge chains: either a comma separated list of chains to merge
              e.g. -merge A,B,C (+), or -merge all if instead all chains in the
              input file should be merged. Can be given multiple times for
              different groups of chains to merge.
        args:
          merge_chains:
            cli: merge_chains
    - vermouth.pipeline_processors.NameMolTypeWrapper:
        condition:
          equal:
            cli: go
            value: null
        cli_flags:
          keep_duplicate_itp:
            cli: sep
            action: store_true
            default: false
            help: Write separate topologies for identical chains
        args:
          keep_duplicate_itp:
            cli: keep_duplicate_itp
          molname:
            cli: molname
    - vermouth.MergeAllMolecules:
        condition:
          all:
            - equal:
                cli: elastic
                value: true
            - equal:
                cli: go
                value: null
            - equal:
                cli: rb_unit
                value: all
        args: {}
    - vermouth.pipeline_processors.ElasticWrapper:
        id: elastic
        condition:
          all:
            - any:
                - equal:
                    cli: elastic
                    value: true
                - equal:
                    cli: to_ff
                    value: elnedyn22
                - equal:
                    cli: to_ff
                    value: elnedyn22p
                - equal:
                    cli: to_ff
                    value: elnedyn21
            - equal:
                cli: go
                value: null
        cli_flags:
          rb_force_constant:
            cli: ef
            type: float
            default: 700
            help: Elastic bond force constant Fc in kJ/mol/nm^2
          rb_lower_bound:
            cli: el
            type: float
            default: 0
            help: 'Elastic bond lower cutoff: F = 0 if rij < lo'
          rb_upper_bound:
            cli: eu
            type: float
            default: 0.85
            help: 'Elastic bond upper cutoff: F = 0 if rij > up'
          res_min_dist:
            cli: ermd
            type: int
            default: 3
            help: The minimum separation between two residues to have an RB
          rb_decay_factor:
            cli: ea
            type: float
            default: 0
            help: Elastic bond decay factor a
          rb_decay_power:
            cli: ep
            type: float
            default: 1
            help: Elastic bond decay power p
          rb_decay_shift:
            cli: es
            type: float
            default: 0
            help: Distance shift applied before the elastic bond decay function is evaluated
          rb_minimum_force:
            cli: em
            type: float
            default: 0
            help: Remove elastic bonds with force constant lower than this
          rb_selection:
            cli: eb
            default: CA
            type: str
            help: Comma separated list of bead names for elastic bonds
          rb_bond_type:
            cli: et
            default: 1
            type: int
            help: Elastic bond type
        args:
          rb_force_constant:
            cli: rb_force_constant
          rb_lower_bound:
            cli: rb_lower_bound
          rb_upper_bound:
            cli: rb_upper_bound
          rb_decay_factor:
            cli: rb_decay_factor
          rb_decay_power:
            cli: rb_decay_power
          rb_decay_shift:
            cli: rb_decay_shift
          rb_minimum_force:
            cli: rb_minimum_force
          rb_selection:
            cli: rb_selection
          rb_unit:
            cli: rb_unit
          res_min_dist:
            cli: res_min_dist
          rb_bond_type:
            cli: rb_bond_type
          force_field:
            variable: ff
    - vermouth.pipeline_processors.VirtualSiteCreatorWrapper:
        condition:
          all:
            - equal:
                cli: water_bias
                value: true
            - equal:
                cli: go
                value: null
        args: {}
    - vermouth.pipeline_processors.ComputeWaterBiasWrapper:
        condition:
          equal:
            cli: water_bias
            value: true
        args:
          water_bias:
            cli: water_bias
          water_bias_eps:
            cli: water_bias_eps
          water_bias_idrs:
            cli: water_bias_idrs
    - vermouth.UnstashAttributes:
        condition:
          equal:
            cli: resid_handling
            value: input
        cli_flags:
          resid_handling:
            cli: resid 
            type: str
            default: mol
            choices:
              - mol
              - input
            help: >
              How to handle resid. Choice of mol or input. mol: resids are
              numbered from 1 to n for each molecule input: resids are the same
              as in the input pdb
        args:
          attributes:
            value:
              - resid
          stash_name:
            value: stash
    - vermouth.SortMoleculeAtoms:
        condition:
          equal:
            cli: go
            value: null
        args: {}
    - vermouth.OutputLogger:
        args: {}
    - vermouth.gmx.topology.TopologyWriter:
        cli_flags:
          top_path:
            cli: o
            type: path
            required: false
            help: Output topology (TOP)
        args:
          top_path:
            cli: top_path

    - vermouth.pdb.WritePDB:
        cli_flags:
          outpath:
            cli: x
            type: path
            required: false
            help: Output coarse grained structure (PDB)
        args:
          path:
            cli: outpath
          omit_charges:
            value: true
          defer_writing:
            value: true
          nan_missing_pos:
            value: false
