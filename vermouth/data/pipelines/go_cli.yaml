martinize2:
  cli:
    groups:
    - title: Virtual site based GoMartini
      flags:
        go_write_file:
          cli: go-write-file
          nargs: '?'
          const: contact_map_martinize.out
          default: false
          type: path
          help: "Write out contact map to file if calculating as part of Martinize2 (default: False)"
        go_low:
          cli: go-low
          type: float
          default: 0.3
          help: "Minimum distance (nm) below which contacts are removed (default: 0.3)"
        go_up:
          cli: go-up
          type: float
          default: 1.1
          help: "Maximum distance (nm) above which contacts are removed (default: 1.1)"
        go_res_dist:
          cli: go-res-dist
          type: int
          default: 3
          help: >-
            Minimum graph distance (similar sequence distance) below which
            contacts are removed (default: 3)
        go_backbone:
          cli: go-backbone
          type: str
          default: BB
          help: >-
            Name of protein backbone bead on which to place a virtual
            interaction go site (default: BB)
        go_atomname:
          cli: go-atomname
          type: str
          default: CA
          help: "Name of the virtual interaction go site atom (default: CA)"
        go_eps:
          cli: go-eps
          type: float
          default: 9.414
          help: "The strength of the Go model structural bias in kJ/mol (default: 9.414)"
        go:
          nargs: '?'
          const: true
          type: path
          default:
          help: >
            Use Martini Go model. Accepts either an input file from the server,
            or just provide the flag to calculate as part of Martinize (default: None)
